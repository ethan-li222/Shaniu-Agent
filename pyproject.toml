[project]
name = "shaniu"
version = "0.1.0"
description = "Emotion-aware personal AI companion"
requires-python = ">=3.11"
# SSE 2.x also permits the FastAPI/Starlette versions in the shared MoneyPrinter environment.
dependencies = ["aiohttp>=3.10,<4", "python-dotenv>=1,<2", "tzdata>=2024.1", "markdown-it-py>=3,<5", "mcp>=1.12,<2", "sse-starlette>=1.6.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
mcp = ["mcp>=1.12,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

